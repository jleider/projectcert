name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Format check
        run: npm run check:format

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Schema + contrast + integrity
        run: npm run validate

      - name: Unit tests
        run: npm test

      - name: Build site
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  link-check:
    name: Internal link check
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Lychee link check (internal only)
        uses: lycheeverse/lychee-action@v2
        with:
          # Internal-only by default — external SEA links live and die
          # on their own schedule and would make this gate flaky. Run
          # the external sweep on a schedule, not per-PR.
          # Exclude fragment-only links (#main, #how-to-cite, etc.):
          # lychee 0.23+ resolves them against --base and reports them
          # as missing files, but they are in-page anchors that the
          # browser handles client-side. We don't validate anchor
          # targets here — the page-level check is the build itself.
          args: |
            --offline
            --no-progress
            --root-dir ${{ github.workspace }}/dist
            --base ${{ github.workspace }}/dist
            --exclude '%23'
            ./dist/**/*.html
          fail: true
