name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Dependency audit (advisory)
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Format check
        run: npm run check:format

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Dead-code check
        run: npm run check:deadcode

      - name: Schema + contrast + integrity
        run: npm run validate

      - name: Unit tests
        run: npm test

      # Also runs the post-build guards, including the offline
      # internal-link check (`scripts/check-internal-links.ts`). That was
      # a separate lychee job until lychee 0.24 changed how `--base` and
      # `--root-dir` compose: every root-relative link began resolving as
      # <dist>/<dist>/states/ut, so the gate went red on an upstream
      # release rather than on any repo change. The in-repo checker is
      # deterministic and runs locally under `npm run verify`. External
      # links stay in the weekly external-link-check.yml sweep.
      - name: Build site
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 7

  e2e:
    name: E2E a11y (Playwright + axe)
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 15
    # Official Playwright image — chromium and all system libraries are
    # preinstalled, so there is no `playwright install --with-deps` apt
    # step to stall on (that step hung for ~1h on a bare runner). The tag
    # MUST track the @playwright/test version in package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    steps:
      - uses: actions/checkout@v7

      - run: npm ci

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      # The Playwright config serves the built dist/ via `astro preview`,
      # so a11y runs against production output, not the dev server.
      - name: Run a11y e2e
        run: npm run test:e2e

  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    needs: [build-and-test, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    timeout-minutes: 10
    environment:
      name: production
      url: https://projectcert.org
    steps:
      # Checkout supplies functions/ and wrangler.toml — `pages deploy`
      # compiles the top-level functions/ directory from the working
      # tree, NOT from the uploaded dist/ artifact. Without this the
      # site deploys with no Functions and /audit/* loses its middleware.
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      # Deploy with the repo's own wrangler rather than
      # cloudflare/wrangler-action. The action installs a wrangler of its
      # own choosing — v3 pinned 3.90.0, whose `peerOptional
      # @cloudflare/workers-types@^4` collides with this repo's v5, so its
      # internal `npm install` failed with ERESOLVE before ever reaching
      # the deploy. Using `npx wrangler` after `npm ci` deploys with the
      # exact version in package-lock.json — the same one the tests and
      # `npm run dev:pages` use — and cannot drift from it. This also
      # matches how audit-ledger-sync.yml already calls wrangler.
      #
      # No positional directory argument: `pages_build_output_dir` in
      # wrangler.toml is authoritative and takes precedence over it.
      - name: Publish
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Assert we are deploying with the lockfile's wrangler and not
          # something npx fetched. The whole point of dropping the action
          # was to stop a third party choosing this version, so verify it
          # rather than assume it.
          version=$(npx wrangler --version 2>/dev/null | tr -d '\r' | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          echo "wrangler $version"
          case "$version" in
            4.*) ;;
            *) echo "::error::expected wrangler 4.x from package-lock.json, got '$version'"; exit 1 ;;
          esac
          # Capture the deployment URL so the gate check below can test the
          # deployment this run produced, rather than a domain that may not
          # point at Pages yet.
          npx wrangler pages deploy --project-name=projectcert --branch=main 2>&1 | tee /tmp/deploy.log

          # Deployment-time proof that functions/ actually shipped. This is
          # the failure the HTTP check below is named for — no Functions
          # means /audit/* is served as static HTML with no middleware — and
          # it is the one signal that survives Cloudflare Access being put
          # in front of the deployment, since Access answers before our code
          # runs and would make the HTTP check pass regardless.
          if ! grep -q "Uploading Functions bundle" /tmp/deploy.log; then
            echo "::error::wrangler uploaded no Functions bundle — functions/ did not ship."
            echo "The console middleware would be absent from this deployment."
            exit 1
          fi

          url=$(grep -oE 'https://[a-z0-9.-]+\.pages\.dev' /tmp/deploy.log | tail -1)
          if [ -z "$url" ]; then
            echo "::error::could not determine the deployment URL from wrangler output"
            exit 1
          fi
          echo "deployed to $url"
          echo "DEPLOY_URL=$url" >> "$GITHUB_ENV"

      # The one deploy failure that looks like success: if functions/ did
      # not ship, /audit/ is served as a plain static asset and answers 200
      # to anyone. A green deploy is not evidence the gate is in force.
      #
      # Tested against $DEPLOY_URL — the deployment this run just created —
      # rather than the apex. The apex is a weaker signal for a per-deploy
      # gate: it depends on DNS and on caches this job does not control, so
      # it can answer for something other than the deployment being
      # verified. The immutable deployment URL cannot. (The apex is worth
      # checking too, but as a release-time check, not a deploy gate.)
      - name: Verify the review console is not publicly readable
        run: |
          # Retry only transient edge/propagation failures. Our own 500
          # ("unconfigured") is stable and must not be retried. No bare
          # `cmd && break` here: under `bash -e` an AND-list whose left side
          # is false fails the step.
          url="$DEPLOY_URL/audit/"
          for attempt in 1 2 3 4 5; do
            read -r status location <<<"$(curl -s --max-time 30 -o /tmp/audit-body.txt \
              -w '%{http_code} %{redirect_url}' "$url" || echo '000 ')"
            case "$status" in
              000|502|503|504)
                if [ "$attempt" -lt 5 ]; then sleep 10; fi
                ;;
              *)
                break
                ;;
            esac
          done
          echo "GET $url -> HTTP $status ${location:-}"
          case "$status" in
            2*)
              echo "::error::the review console is publicly readable (HTTP $status)."
              echo "The Pages Functions in functions/ most likely did not deploy, so the middleware is absent."
              exit 1
              ;;
            401|403)
              echo "Gate in force: the console middleware requires credentials."
              ;;
            3*)
              # Cloudflare Access answers at the edge, before our Function
              # runs. The invariant still holds — the console is not publicly
              # readable — but say plainly which layer enforced it, so a pass
              # here is never mistaken for evidence that the middleware works.
              case "$location" in
                *cloudflareaccess.com*)
                  echo "Gate in force: Cloudflare Access redirected to its login."
                  echo "::notice::Satisfied by Access, not by functions/audit/_middleware.ts — that code was not reached, so this run does not exercise it. The middleware is covered by tests/audit-api.integration.test.ts and npm run e2e:audit, and its presence in the deployment by the Functions-bundle assertion above."
                  ;;
                *)
                  echo "Console redirects to ${location:-an unknown target} (HTTP $status); not publicly readable."
                  ;;
              esac
              ;;
            500)
              # Distinguish our fail-closed refusal from an unrelated origin
              # error — the status alone does not identify the source.
              if grep -q "not configured for authentication" /tmp/audit-body.txt; then
                echo "::warning::the console middleware reports no credential path configured."
                echo "AUDIT_USER/AUDIT_PASSWORD (or the Access vars) are not reaching the Functions."
              else
                echo "::error::HTTP 500 that did not come from the console middleware:"
                head -c 500 /tmp/audit-body.txt
                exit 1
              fi
              ;;
            *)
              echo "Console is not publicly readable (HTTP $status)."
              ;;
          esac
