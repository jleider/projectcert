name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Dependency audit (advisory)
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Format check
        run: npm run check:format

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Dead-code check
        run: npm run check:deadcode

      - name: Schema + contrast + integrity
        run: npm run validate

      - name: Unit tests
        run: npm test

      # Also runs the post-build guards, including the offline
      # internal-link check (`scripts/check-internal-links.ts`). That was
      # a separate lychee job until lychee 0.24 changed how `--base` and
      # `--root-dir` compose: every root-relative link began resolving as
      # <dist>/<dist>/states/ut, so the gate went red on an upstream
      # release rather than on any repo change. The in-repo checker is
      # deterministic and runs locally under `npm run verify`. External
      # links stay in the weekly external-link-check.yml sweep.
      - name: Build site
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  e2e:
    name: E2E a11y (Playwright + axe)
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 15
    # Official Playwright image — chromium and all system libraries are
    # preinstalled, so there is no `playwright install --with-deps` apt
    # step to stall on (that step hung for ~1h on a bare runner). The tag
    # MUST track the @playwright/test version in package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    steps:
      - uses: actions/checkout@v4

      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # The Playwright config serves the built dist/ via `astro preview`,
      # so a11y runs against production output, not the dev server.
      - name: Run a11y e2e
        run: npm run test:e2e

