name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Dependency audit (advisory)
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Format check
        run: npm run check:format

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Dead-code check
        run: npm run check:deadcode

      - name: Schema + contrast + integrity
        run: npm run validate

      - name: Unit tests
        run: npm test

      - name: Build site
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  e2e:
    name: E2E a11y (Playwright + axe)
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 15
    # Official Playwright image — chromium and all system libraries are
    # preinstalled, so there is no `playwright install --with-deps` apt
    # step to stall on (that step hung for ~1h on a bare runner). The tag
    # MUST track the @playwright/test version in package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
    steps:
      - uses: actions/checkout@v4

      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # The Playwright config serves the built dist/ via `astro preview`,
      # so a11y runs against production output, not the dev server.
      - name: Run a11y e2e
        run: npm run test:e2e

  link-check:
    name: Internal link check
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Lychee link check (internal only)
        uses: lycheeverse/lychee-action@v2
        with:
          # Internal-only by default — external SEA links live and die
          # on their own schedule and would make this gate flaky. Run
          # the external sweep on a schedule, not per-PR.
          # Exclude fragment-only links (#main, #how-to-cite, etc.):
          # lychee 0.23+ resolves them against --base and reports them
          # as missing files, but they are in-page anchors that the
          # browser handles client-side. We don't validate anchor
          # targets here — the page-level check is the build itself.
          args: |
            --offline
            --no-progress
            --root-dir ${{ github.workspace }}/dist
            --base ${{ github.workspace }}/dist
            --exclude '%23'
            ./dist/**/*.html
          fail: true
