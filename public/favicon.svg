<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="projectcert">
  <title>projectcert</title>
  <!--
    Standalone SVGs can't inherit CSS custom properties from the
    embedding page, so the brand-mark palette is mirrored here as
    in-SVG vars and flipped for dark backgrounds via media query.
    Light-mode values mirror tokens.css `--bin-0`..`--bin-3`. Dark-mode
    values are tuned for browser-tab-bar visibility — the data-ramp
    dark-mode `--bin-0` (#3a2c54) would disappear into a dark tab bar,
    so the favicon shifts the darkest tile lighter rather than mirroring
    the data ramp directly.
  -->
  <style>
    svg {
      --bin-0: #f5e8ff;
      --bin-1: #c9a0ff;
      --bin-2: #7a3ed8;
      --bin-3: #3d1971;
      --check: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --bin-0: #ffffff;
        --bin-1: #e1c5ff;
        --bin-2: #c9a0ff;
        --bin-3: #7a3ed8;
        --check: #ffffff;
      }
    }
  </style>
  <rect x="2"  y="2"  width="13" height="13" rx="2.5" fill="var(--bin-0)"/>
  <rect x="17" y="2"  width="13" height="13" rx="2.5" fill="var(--bin-1)"/>
  <rect x="2"  y="17" width="13" height="13" rx="2.5" fill="var(--bin-2)"/>
  <rect x="17" y="17" width="13" height="13" rx="2.5" fill="var(--bin-3)"/>
  <path d="M20.25 24.25 L23 27 L27.75 21.5"
        fill="none" stroke="var(--check)" stroke-width="2.4"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
