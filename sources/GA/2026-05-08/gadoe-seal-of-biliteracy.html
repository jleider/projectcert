name":"DefaultTemplate","templateName":"Default"},"isFrontPage":false,"isPostsPage":false},"__TEMPLATE_QUERY_DATA__":{"page":{"__typename":"Page","isPreview":false,"previewOf":null,"databaseId":214,"title":"Seal of Biliteracy","content":"\u003cdiv class=\"wp-block-columns is-layout-flex wp-container-core-columns-is-layout-9d6595d7 wp-block-columns-is-layout-flex\"\u003e\n\u003cdiv class=\"wp-block-column is-layout-flow wp-block-column-is-layout-flow\" style=\"flex-basis:66.66%\"\u003e\n\u003cp\u003eThe Georgia Seal of Biliteracy is awarded to high school graduates who demonstrate proficiency in English and at least one additional language. This prestigious recognition appears on the diploma and transcript, highlighting students’ linguistic capabilities to colleges, employers, and scholarship committees.\u003c/p\u003e\n\n\n\n\u003ch2 class=\"wp-block-heading\"\u003eWhy Earn the Seal?\u003c/h2\u003e\n\u003c/div\u003e\n\n\n\n\u003cdiv class=\"wp-block-column is-layout-flow wp-block-column-is-layout-flow\" style=\"flex-basis:33.33%\"\u003e\n\u003cfigure class=\"wp-block-image size-full\"\u003e\u003cimg loading=\"lazy\" decoding=\"async\" width=\"187\" height=\"179\" src=\"https://cdn-cms-gadoe-org-fpf4gke0fwd4htef.a03.azurefd.net/app/uploads/2024/08/Georgia-Seal-of-Biliteracy.jpg\" alt=\"Seal of Biliteracy\" class=\"wp-image-4698\"\u003e\u003c/figure\u003e\n\u003c/div\u003e\n\u003c/div\u003e\n\n\n\n\u003cul class=\"wp-block-list\"\u003e\n\u003cli\u003e\u003cstrong\u003eBoost Your Resume:\u003c/strong\u003e Stand out in the job market and college admissions by showcasing your bilingual skills.\u003c/li\u003e\n\n\n\n\u003cli\u003e\u003cstrong\u003eCultural Competence:\u003c/strong\u003e Gain a competitive edge with your ability to engage and connect across diverse cultures.\u003c/li\u003e\n\n\n\n\u003cli\u003e\u003cstrong\u003eAcademic Acknowledgment:\u003c/strong\u003e Receive formal recognition for your hard work and dedication to mastering another language.\u003c/li\u003e\n\u003c/ul\u003e\n\n\n\n\u003ch2 class=\"wp-block-heading\"\u003eEligibility Requirements:\u003c/h2\u003e\n\n\n\n\u003cul class=\"wp-block-list\"\u003e\n\u003cli\u003eProficiency in English by meeting English Language Arts graduation requirements with a 3.0 GPA or higher.\u003c/li\u003e\n\n\n\n\u003cli\u003eDemonstrate language proficiency by achieving required scores on recognized assessments such as Advanced Placement (AP), International Baccalaureate (IB), SAT II, or other approved tests.\u003c/li\u003e\n\u003c/ul\u003e\n\n\n\n\u003cdiv class=\"call-out-box bg-gadoeBlue-50\"\u003e\u003ch2 id=\"georgia-seal-of-biliteracy-important-documents\" class=\"text-gadoeGray-800 text-2xl lg:text-3xl group relative flex\"\u003eGeorgia Seal of Biliteracy – Important Documents\u003c/h2\u003e\u003cp class=\"text-gadoeGray-800 mb-2 typography lg:typography-lg\"\u003e\u003ca href=\"https://url.gadoe.org/88uk4\" target=\"_blank\"\u003eGeorgia Seal of Biliteracy at a Glance\u003c/a\u003e\u003cbr\u003e\u003ca href=\"https://url.gadoe.org/hxb0q\" target=\"_blank\"\u003eGeorgia Seal of Biliteracy Guidance Document\u003c/a\u003e\u003cbr\u003e\u003ca href=\"https://url.gadoe.org/ehmq3\" target=\"_blank\"\u003eGeorgia Seal of Biliteracy Text of the Law\u003c/a\u003e\u003cbr\u003e\u003ca href=\"https://url.gadoe.org/zdm5z\" target=\"_blank\"\u003eGeorgia Seal of Biliteracy Approved Assessments\u003c/a\u003e\u003cbr\u003e\u003ca href=\"https://url.gadoe.org/90mql\" target=\"_blank\"\u003eGeorgia Seal of Biliteracy Frequently Asked Questions\u003c/a\u003e\u003c/p\u003e\u003c/div\u003e\n","pageOptions":{"__typename":"PageOptions","breadcrumbsTitleOverride":null,"featuredOnlySearch":false,"newsletterGadoeOffice":null,"hasPressReleasesSection":false,"linkedPressReleasesHeading":null,"linkedPressReleases":null,"isPlaceholderPage":false,"placeholderLink":null},"editorBlocks":[{"__typename":"CoreColumns","id":"69fd881e804c6","name":"core/columns","renderedHtml":"\u003cdiv class=\"wp-block-col ,"isFrontPage":false,"isPostsPage":false,"title":"Seal of Biliteracy","link":"https://gadoe.org/grants-awards-diploma-seals/seal-of-biliteracy/","pageOptions":{"__typename":"PageOptions","hideFromNav":false,"isPlaceholderPage":false,"placeholderLink":null},"children({\"where\":{\"orderby\":[{\"field\":\"MENU_ORDER\",\"order\":\"ASC\"},{\"field\":\"TITLE\",\"order\":\"ASC\"}]}})":{"__typename":"HierarchicalContentNodeToContentNodeChildrenConnection","nodes":[]}},"ROOT_QUERY":{"__typename":"RootQuery","nodeByUri({\"uri\":\"/grants-awards-diploma-seals/seal-of-biliteracy\"})":{"__ref":"Page:cG9zdDoyMTQ="},"page({\"asPreview\":false,\"id\":214,\"idType\":\"DATABASE_ID\"})":{"__typename":"Page","databaseId":214,"title":"Seal of Biliteracy","content":"\u003cdiv class=\"wp-block-columns is-layout-flex wp-container-core-columns-is-layout-9d6595d7 wp-block-columns-is-layout-flex\"\u003e\n\u003cdiv class=\"wp-block-column is-layout-flow wp-block-column-is-layout-flow\" style=\"flex-basis:66.66%\"\u003e\n\u003cp\u003eThe Georgia Seal of Biliteracy is awarded to high school graduates who demonstrate proficiency in English and at least one additional language. This prestigious recognition appears on the diploma and transcript, highlighting students’ linguistic capabilities to colleges, employers, and scholarship committees.\u003c/p\u003e\n\n\n\n\u003ch2 class=\"wp-block-heading\"\u003eWhy Earn the Seal?\u003c/h2\u003e\n\u003c/div\u003e\n\n\n\n\u003cdiv class=\"wp-block-column is-layout-flow wp-block-column-is-layout-flow\" style=\"flex-basis:33.33%\"\u003e\n\u003cfigure class=\"wp-block-image size-full\"\u003e\u003cimg loading=\"lazy\" decoding=\"async\" width=\"187\" height=\"179\" src=\"https://cdn-cms-gadoe-org-fpf4gke0fwd4htef.a03.azurefd.net/app/uploads/2024/08/Georgia-Seal-of-Biliteracy.jpg\" alt=\"Seal of Biliteracy\" class=\"wp-image-4698\"\u003e\u003c/figure\u003e\n\u003c/div\u003e\n\u003c/div\u003e\n\n\n\n\u003cul class=\"wp-block-list\"\u003e\n\u003cli\u003e\u003cstrong\u003eBoost Your Resume:\u003c/strong\u003e Stand out in the job market and college admissions by showcasing your bilingual skills.\u003c/li\u003e\n\n\n\n\u003cli\u003e\u003cstrong\u003eCultural Competence:\u003c/strong\u003e Gain a competitive edge with your ability to engage and connect across diverse cultures.\u003c/li\u003e\n\n\n\n\u003cli\u003e\u003cstrong\u003eAcademic Acknowledgment:\u003c/strong\u003e Receive formal recognition for your hard work and dedication to mastering another language.\u003c/li\u003e\n\u003c/ul\u003e\n\n\n\n\u003ch2 class=\"wp-block-heading\"\u003eEligibility Requirements:\u003c/h2\u003e\n\n\n\n\u003cul class=\"wp-block-list\"\u003e\n\u003cli\u003eProficiency in English by meeting English Language Arts graduation requirements with a 3.0 GPA or higher.\u003c/li\u003e\n\n\n\n\u003cli\u003eDemonstrate language proficiency by achieving required scores on recognized assessments such as Advanced Placement (AP), International Baccalaureate (IB), SAT II, or other approved tests.\u003c/li\u003e\n\u003c/ul\u003e\n\n\n\n\u003cdiv class=\"call-out-box bg-gadoeBlue-50\"\u003e\u003ch2 id=\"georgia-seal-of-biliteracy-important-documents\" class=\"text-gadoeGray-800 text-2xl lg:text-3xl group relative flex\"\u003eGeorgia Seal of Biliteracy – Important Documents\u003c/h2\u003e\u003cp class=\"text-gadoeGray-800 mb-2 typography lg:typography-lg\"\u003e\u003ca href=\"https://url.gadoe.org/88uk4\" target=\"_blank\"\u003eGeorgia Seal of Biliteracy at a Glance\u003c/a\u003e\u003cbr\u003e\u003ca href=\"https://url.gadoe.org/hxb0q\" target=\"_blank\"\u003eGeorgia Seal of Biliteracy Guidance Document\u003c/a\u003e\u003cbr\u003e\u003ca href=\"https://url.gadoe.org/ehmq3\" target=\"_blank\"\u003eGeorgia Seal of Biliteracy Text of the Law\u003c/a\u003e\u003cbr\u003e\u003ca href=\"https://url.gadoe.org/zdm5z\" target=\"_blank\"\u003eGeorgia Seal of Biliteracy Approved Assessments\u003c/a\u003e\u003cbr\u003e\u003ca href=\"https://url.gadoe.org/90mql\" target=\"_bl
